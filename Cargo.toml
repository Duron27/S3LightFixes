[package]
name = "s3lightfixes"
authors = ["Dave Corley", "MOMW Contributors"]
version = "0.4.59"
edition = "2024"
autobins = false

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.1"
clap_mangen = "0.3.0"
ordered_hash_map = "0.6.0"
palette = "0.7.6"
rayon = "1.12.0"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"

# Android-specific dependencies
[target.'cfg(target_os = "android")'.dependencies]
log = "0.4"
android_logger = "0.15"

# Desktop-only dependencies
[target.'cfg(not(target_os = "android"))'.dependencies]
native-dialog = "0.9.6"

[dependencies.openmw-config]
version = "1.1.0"

[dependencies.vfstool_lib]
version = "0.9.0"

[dependencies.tes3]
git = "https://github.com/Greatness7/tes3"
branch = "main"
features = ["esp"]

[lib]
name = "s3lightfixes"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

# The binary - only for desktop
[[bin]]
name = "s3lightfixes-cli"
path = "src/main.rs"
